name: Browser core and Relay checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm ci --prefix relay --ignore-scripts --no-audit --no-fund
      - run: node scripts/vercel-build.mjs
      - run: python scripts/validate.py
      - run: node --check src/app.mjs
      - run: node --check src/transport.mjs
      - run: node --check src/group-transport.mjs
      - run: node --check src/group-session.mjs
      - run: node --check src/emulator-worker.mjs
      - run: node tests/background-mode-smoke.mjs
      - run: node tests/packet-wait.test.mjs
      - run: node tests/mouse-controls-smoke.mjs
      - run: node tests/solo-core-diagnostic-smoke.mjs
      - run: node --check src/emulator-worker.mjs
      - run: npm test --prefix relay
      - run: node -e "require('fs').mkdirSync('logs',{recursive:true})"
      - run: node tests/core-smoke.mjs
      - run: node tests/worker-smoke.mjs
      - run: node tests/core-group-smoke.mjs
      - run: node tests/worker-group-smoke.mjs
      - run: node tests/worker-group-smoke.mjs
        env:
          STALL_PEER_MS: '2200'
      - run: node tests/group-failure-smoke.mjs
