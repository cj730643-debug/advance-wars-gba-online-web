name: Rebuild calibrated WebAssembly core
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  rebuild:
    if: startsWith(github.event.head_commit.message, '[rebuild-core]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.74
      - run: npm ci --prefix relay --ignore-scripts --no-audit --no-fund
      - run: node scripts/vercel-build.mjs
      - name: Extract the exact bundled mGBA source
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import shutil
          archive = Path('dist/source.zip')
          with ZipFile(archive) as z:
              expected = 'aw-web-source/vendor/mgba-wifi-link/src/gba/sio/netplay/session-v2.c'
              if expected not in z.namelist():
                  raise SystemExit('Bundled mGBA source is incomplete')
              z.extractall('/tmp/aw-web-source')
          source = Path('/tmp/aw-web-source/aw-web-source/vendor/mgba-wifi-link')
          if not source.is_dir():
              raise SystemExit('Bundled mGBA source directory is missing')
          shutil.copytree(source, Path('vendor/mgba-wifi-link'), dirs_exist_ok=True)
          PY
      - run: python scripts/build_core.py --emsdk "$EMSDK" --source vendor/mgba-wifi-link
      - run: mkdir -p logs
      - run: node tests/calibration-timeout-build-smoke.mjs
      - run: node tests/core-smoke.mjs
      - run: node tests/worker-smoke.mjs
      - run: node tests/core-group-smoke.mjs
      - run: node tests/worker-group-smoke.mjs
      - run: node tests/group-failure-smoke.mjs
      - name: Record rebuilt core evidence
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, re
          digest = hashlib.sha256(Path('dist/aw-core.wasm').read_bytes()).hexdigest()
          report = Path('TEST_REPORT.txt')
          text = report.read_text(encoding='utf-8')
          text, count = re.subn(r'当前 WASM SHA-256：.*', f'当前 WASM SHA-256：{digest}。', text)
          if count != 1:
              raise SystemExit('Could not update the unique WASM SHA-256 in TEST_REPORT.txt')
          text += (
              '\n\n2026-10-20 网络校准超时修复：\n'
              '- 根据用户诊断日志，协议 V2 在房间连接后因 reason=29（calibration timeout）停止，尚未进入 READY。\n'
              '- 将底层协议 V2 的绝对校准/接受期限从 3 秒延长到 10 秒。\n'
              '- 校准样本上限从 1 秒提高到 10 秒，并将校准策略版本提升至 2，以容忍短暂后台节流且拒绝混用旧核心。\n'
              '- 本次重建后重新运行核心、Worker 双人/多人及失败注入测试；仅以 CI 实际结果为准。\n'
              '- 此修复不证明商业汉化 ROM 的完整对局已通过实机验收。\n'
          )
          report.write_text(text, encoding='utf-8')
          print('Rebuilt WASM SHA-256:', digest)
          PY
      - run: python scripts/prepare.py
      - run: node scripts/split-source.mjs
      - run: python scripts/validate.py
      - name: Publish rebuilt core and corresponding source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add TEST_REPORT.txt dist/aw-core.mjs dist/aw-core.wasm dist/test-evidence.json dist/SHA256SUMS.txt dist/TEST_REPORT.txt source-archive/
          if git diff --cached --quiet; then
            echo 'No generated artifact changes to publish.'
          else
            git commit -m '[core-artifact] Rebuilt WASM with WAN calibration timeout'
            git push
          fi
